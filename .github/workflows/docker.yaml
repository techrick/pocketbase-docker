name: docker

# Reusable single-version build. Called by sync.yaml per missing version,
# or run manually to (re)build one specific version.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      latest:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'PocketBase version tag, e.g. v0.39.0'
        required: true
      latest:
        description: 'Also tag as :latest'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: t
        run: |
          REF="${{ inputs.tag }}"
          echo "tag=${REF}"       >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.t.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.t.outputs.tag }}
            type=raw,value=latest,enable=${{ inputs.latest }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.t.outputs.version }}
          cache-from: type=gha,scope=${{ steps.t.outputs.tag }}
          cache-to: type=gha,mode=max,scope=${{ steps.t.outputs.tag }}
